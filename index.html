const todayS=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);

}

let CW=null;

function nowHtml(){
  if(!CW)return '📍 正在取得目前位置的天氣…';
  if(CW.err)return '📍 暫時無法取得即時天氣<br><small>（'+esc(CW.why||'')+'）點我重試</small>';
  return `📍 ${esc(CW.label)}　${WC(CW.c)} ${WT(CW.c)} <b>${CW.t}°C</b><br><small>體感 ${CW.ap}°　濕度 ${CW.h}%　風 ${CW.w} km/h</small>`;
}
document.addEventListener('click',e=>{const n=e.target.closest&&e.target.closest('.nw');if(n&&CW&&CW.err){CW=null;paintNow();loadNow()}});
function paintNow(){const el=document.querySelector('.nw');if(el)el.innerHTML=nowHtml()}
async function loadNow(){
  let lat=25.033,lon=121.565,label='台北';
  try{
    const pos=await new Promise((ok,no)=>{if(!navigator.geolocation)return no();navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000,maximumAge:600000})});
    lat=pos.coords.latitude;lon=pos.coords.longitude;label='目前位置';
  }catch(e){}
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+lat.toFixed(3)+'&longitude='+lon.toFixed(3)+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto';
    let r,c;
    for(let k=0;k<2&&!c;k++){
      try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),10000);r=await fetch(u,{signal:ac.signal});clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);c=(await r.json()).current;if(!c)throw new Error('回傳沒有天氣資料')}catch(e){if(k)throw e;await new Promise(z=>setTimeout(z,1200))}
    }
    CW={c:c.weather_code,t:Math.round(c.temperature_2m),ap:Math.round(c.apparent_temperature),h:Math.round(c.relative_humidity_2m),w:Math.round(c.wind_speed_10m),label};
  }catch(e){if(!CW||CW.err)CW={err:true,why:(e&&e.name==='AbortError')?'連線逾時':(e&&e.message)||'連線失敗'}}
  paintNow();
}

document.addEventListener('click',ev=>{
  if(ev.target.matches&&ev.target.matches('input[data-date]')){ev.preventDefault();ev.target.blur();
    sheet(`<h2>選擇 Day ${S.day+1} 的日期</h2><label>日期<input type="date" name="dt" value="${esc(S.dates[S.day])}" style="min-height:48px;font-size:18px;width:100%;box-sizing:border-box"></label><small style="display:block;margin:-2px 0 10px;color:#8a7a62">後面還沒填日期的天數，會自動依序接著排</small>${btns}`,f=>{const v=f.get('dt')||'';S.dates[S.day]=v;for(let k=S.day+1;k<S.days.length;k++)if(!S.dates[k])S.dates[k]=v?addD(v,k-S.day):''});
    setTimeout(()=>{const x=$('#sheet [name=dt]');if(x){x.focus();try{x.showPicker()}catch(e){}}},120);return}
  if(ev.target.matches&&ev.target.matches('input[type=date]')){try{ev.target.showPicker()}catch(e){}return}
  const t=ev.target.closest('nav button');
  if(t){S.tab=t.dataset.t;render();window.scrollTo(0,0);return}
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,L=S.days[S.day];
  if(a==='close')close();
  else if(a==='day'){S.day=i;render()}
  else if(a==='mo'){S.mo=S.mo===+i?null:+i;render()}
  else if(a==='addday'){const p=S.dates[S.days.length-1];S.days.push([]);S.dates.push(p?addD(p,1):'');S.wx.push({w:'',t:''});S.day=S.days.length-1;render()}
  else if(a==='delday'){askDel('確定刪除這一天與所有行程？',()=>{S.days.splice(S.day,1);S.dates.splice(S.day,1);S.wx.splice(S.day,1);S.day=Math.max(0,S.day-1);})}
  else if(a==='new')itemForm();
  else if(a==='edit')itemForm(i);
  else if(a==='itick'){if(L[i]){L[i].done=!L[i].done;render()}}
  else if(a==='del'){askDel('確定刪除這個行程？',()=>{L.splice(i,1);})}
  else if(a==='up'||a==='down'){const j=a==='up'?i-1:i+1;if(L[j]){[L[i],L[j]]=[L[j],L[i]];render()}}
  else if(a==='btoggle'){const it=BL()[i];if(it){it.done=!it.done;render()}}
  else if(a==='bdel'){BL().splice(i,1);render()}
  else if(a==='bedit')buyForm(i);
  else if(a==='ptoggle'){const it=PL()[i];if(it){it.done=!it.done;render()}}
  else if(a==='ptab'){S.pk=i;render()}
  else if(a==='stab'){S.sk=i;render()}
  else if(a==='prename'){
    const cur0=S.shops.slice();
    sheet(`<h2>編輯成員或購買清單分類</h2><div id="pnl">${cur0.map((p,k)=>`<div class="mrw" data-k="${k}"><div style="flex:1;min-width:0"><input name="p${k}" maxlength="12" value="${esc(p.name)}" aria-label="名稱 ${k+1}"></div><button type="button" class="link pdl" data-k="${k}">刪除</button></div>`).join('')}</div><label>新增成員或分類（可留空）<input name="pnew" maxlength="12" placeholder="例如：爸爸、伴手禮"></label><p class="mute" style="font-size:13px;margin:4px 0 8px">這裡的名稱只影響購物清單，不會改到記帳的成員。</p>${btns}`,f=>{
      const keep=[],names=new Set(),cp=S.shops[S.sk];
      cur0.forEach((p,k)=>{if($('#sheet .mrw[data-k="'+k+'"]').dataset.del)return;let v=(f.get('p'+k)||'').trim()||p.name;if(names.has(v))v=p.name;if(names.has(v))return;names.add(v);p.name=v;keep.push(p)});
      const nw=(f.get('pnew')||'').trim();if(nw&&!names.has(nw))keep.push({name:nw,buys:[]});
      if(!keep.length)return;
      S.shops=keep;const ix=keep.indexOf(cp);S.sk=ix>=0?ix:0});
    $('#sheet').querySelectorAll('.pdl').forEach(b=>{b.onclick=()=>{const rows=$('#sheet').querySelectorAll('.mrw:not([data-del])');if(rows.length<=1){toastMsg('至少要保留一個');return}const r=b.closest('.mrw');r.dataset.del='1';r.style.display='none'}});
  }
  else if(a==='padd')addPack();
  else if(a==='rcview'){const e=S.exp[i];if(e&&rcs(e).length)sheet(`<h2>收據：${esc(e.title)}</h2>${rcs(e).map(u=>`<img src="${u}" alt="收據" style="width:100%;max-height:60vh;object-fit:contain;border-radius:12px;margin-bottom:8px">`).join('')}<div class="btns"><button type="button" data-a="close">關閉</button></div>`,()=>{})}
  else if(a==='st'){S.st=+i;render()}
  else if(a==='ttl'){ev.stopPropagation();const k=ev.target.closest('[data-k]').dataset.k;sheet(`<h2>編輯標題</h2><label>這一頁的標題<input name="t" maxlength="24" value="${esc(ttl(k))}" placeholder="${esc(TT[k])}"></label><small style="display:block;margin:-4px 0 8px;color:var(--mute)">清空後標題會留白（點留白的位置可再編輯）</small>${btns}`,f=>{const v=(f.get('t')||'').trim();if(v===TT[k])delete S.titles[k];else S.titles[k]=v});setTimeout(()=>{const x=$('#sheet input');if(x){x.focus();x.select()}},50)}
  else if(a==='dest'){ev.stopPropagation();sheet(`<h2>旅遊地點</h2><label>想去哪裡？<input name="d" maxlength="20" value="${esc(S.dest)}" placeholder="登打這次想去的地方，例如：大阪 ＆ 京都"></label>${btns}`,f=>{S.dest=(f.get('d')||'').trim();S.destSet=1});setTimeout(()=>{const x=$('#sheet [name=d]');if(x){x.focus();x.select()}},60)}
  else if(a==='expdata')expData();
  else if(a==='expcopy'){try{navigator.clipboard.writeText(window.__expj||'').then(()=>toastMsg('已複製'),()=>toastMsg('這裡無法複製，請改用「儲存成檔案」'))}catch(e){toastMsg('這裡無法複製，請改用「儲存成檔案」')}}
  else if(a==='expsave'){(async()=>{let dl=null;try{dl=await claude.use('downloads')}catch(e){}const bl=new Blob([window.__expj||''],{type:'application/json'});if(dl){try{await dl.save({filename:'旅遊資料.json',data:bl});toastMsg('已儲存');return}catch(e){if(e&&e.code==='declined')return}}try{const x=document.createElement('a');x.href=URL.createObjectURL(bl);x.download='旅遊資料.json';document.body.appendChild(x);x.click();x.remove();toastMsg('已儲存')}catch(e){toastMsg('這裡無法儲存檔案')}})()}
  else if(a==='pdfplan')pdfPlan();
  else if(a==='pdfpack')pdfPack();
  else if(a==='pdfshop')pdfShop();
  else if(a==='pdfeat')pdfEat();
  else if(a==='pdfmoney')pdfMoney();
  else if(a==='pdfstat')pdfStat();
  else if(a==='cover')coverView();
  else if(a==='flight')flightView();
  else if(a==='flightedit')flightForm();
  else if(a==='ynew')eatForm();
  else if(a==='yedit')eatForm(i);
  else if(a==='ystar'){const x=S.eats[i],n=+ev.target.closest('[data-n]').dataset.n;if(x){x.star=(+x.star===n)?0:n;render()}}
  else if(a==='ydel'){S.eats.splice(i,1);render()}
  else if(a==='pbuy')buyForm();
  else if(a==='pnew'){sheet(`<h2>新增要帶的物品</h2><label>物品名稱<input name="n" required maxlength="30" placeholder="例如：護照"></label><label>備註（可選）<input name="note" maxlength="100" placeholder="例如：放隨身包、要充飽電"></label>${btns}`,f=>{const v=(f.get('n')||'').trim();if(v)PL().push({id:uid(),text:v,note:(f.get('note')||'').trim(),done:false})});setTimeout(()=>{const x=$('#sheet input');if(x)x.focus()},50)}
  else if(a==='pedit')packEdit(i);
  else if(a==='pdel'){askDel('確定刪除這個物品？',()=>{PL().splice(i,1);})}
  else if(a==='pdefaults'){const have=new Set(PL().map(x=>x.text));PACK_DEFAULTS.forEach(t=>{if(!have.has(t))PL().push({id:uid(),text:t,done:false})});render()}
  else if(a==='pclear'){PL().forEach(x=>x.done=false);render()}
  else if(a==='newexp')expForm();
  else if(a==='flip'){const e=S.exp[i];if(e){const k=e.id||'i'+i;FL[k]=!FL[k];const fx=ev.target.closest('.fx');if(fx)fx.classList.toggle('on',!!FL[k])}}
  else if(a==='eedit')expForm(i);
  else if(a==='edel'){askDel('確定刪除這筆花費？',()=>{S.exp.splice(i,1);})}
  else if(a==='members'){
    const old=S.members.slice(),pend={};
    sheet(`<h2>編輯成員</h2>${old.map((m,k)=>`<div class="mrw" data-k="${k}"><span class="mp" id="mp${k}">${avt(m)}</span><div style="flex:1;min-width:0"><input name="m${k}" maxlength="12" value="${esc(m)}" aria-label="成員 ${k+1} 名稱"><label class="up">📷 上傳縮圖<input type="file" accept="image/*" data-k="${k}" hidden></label>${S.mav[m]?`<button type="button" class="link rmv" data-k="${k}">移除</button>`:''}</div></div>`).join('')}<label>新增成員（可留空）<input name="mnew" maxlength="12" placeholder="例如：小明"></label>${btns}`,f=>{
      const map={},out=[],av={};
      old.forEach((m,k)=>{const v=(f.get('m'+k)||'').trim();if(v&&!out.includes(v)){out.push(v);map[m]=v;const p=pend[k]!==undefined?pend[k]:S.mav[m];if(p)av[v]=p}else map[m]=null});
      const nw=(f.get('mnew')||'').trim();if(nw&&!out.includes(nw))out.push(nw);
      if(!out.length)return;
      S.exp.forEach(e=>{if(map[e.payer]!==undefined)e.payer=map[e.payer]||out[0];if(Array.isArray(e.split))e.split=e.split.map(x=>map[x]!==undefined?map[x]:x).filter(Boolean)});
      {const np=out.map(n=>{const k=old.findIndex(o=>map[o]===n);return k>=0&&S.packs[k]?S.packs[k]:{name:n,items:[],buys:[]}});S.packs=np.concat(S.packs.slice(old.length))}
      S.members=out;S.mav=av;
    });
    $('#sheet').querySelectorAll('input[type=file]').forEach(fi=>{fi.onchange=()=>{const fl=fi.files[0],k=+fi.dataset.k;if(!fl)return;const u=URL.createObjectURL(fl),im=new Image();im.onload=()=>{const N=160,c=document.createElement('canvas');c.width=c.height=N;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,N,N);pend[k]=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(u);$('#mp'+k).innerHTML=`<i class="av"><img src="${pend[k]}" alt=""></i>`};im.src=u}});
    $('#sheet').querySelectorAll('.rmv').forEach(b=>{b.onclick=()=>{const k=+b.dataset.k;pend[k]='';const n=$('#sheet [name=m'+k+']').value||'?';$('#mp'+k).innerHTML=`<i class="av">${esc([...n][0]||'?')}</i>`;b.remove()}});
  }
});
render();
loadWx();
initRemote();
loadNow();
setInterval(()=>{if(document.visibilityState==='visible')loadNow()},600000);

(function(){let d=null;document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest&&e.target.closest('header .chips');if(!c)return;d={c,x:e.clientX,l:c.scrollLeft,m:false}});
addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x;if(Math.abs(dx)>5)d.m=true;if(d.m)d.c.scrollLeft=d.l-dx});
addEventListener('pointerup',()=>{if(d&&d.m){const c=d.c;c.dataset.drag='1';setTimeout(()=>delete c.dataset.drag,0)}d=null});
addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('header .chips');if(c&&c.dataset.drag){e.stopPropagation();e.preventDefault()}},true)})();

(()=>{let comp=false;const run=t=>{Q[t.dataset.q]=t.value;const pos=t.selectionStart;render();const n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}};
document.addEventListener('compositionstart',e=>{if(e.target.matches&&e.target.matches('[data-q]'))comp=true});
document.addEventListener('compositionend',e=>{if(e.target.matches&&e.target.matches('[data-q]')){comp=false;run(e.target)}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('[data-q]')&&!comp&&!e.isComposing)run(t)})})();
</script>
</body>
</html>
